<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地视觉训练平台</title>
<link rel="stylesheet" href="/style.css?v=26">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>本地视觉训练平台</h1>
    <span id="envStatus" class="badge">检测中…</span>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="upload">上传</button>
    <button class="tab" data-tab="detect">图片检测</button>
    <button class="tab" data-tab="video">视频检测</button>
    <button class="tab" data-tab="train">训练</button>
  </nav>

  <!-- ========== 上传 ========== -->
  <section class="panel active" id="tab-upload">
    <div class="row">
      <div class="col">
        <h2>图片</h2>
        <div class="drop" id="dropZone">
          <p>点击选择 或 拖拽图片到这里</p>
          <input type="file" id="fileInput" accept="image/*" multiple>
        </div>
        <button class="btn" id="uploadBtn" disabled>上传图片</button>
        <div class="status" id="status"></div>
      </div>
      <div class="col">
        <h2>视频</h2>
        <div class="drop" id="dropZoneVideo">
          <p>点击选择 或 拖拽视频到这里</p>
          <input type="file" id="videoInput" accept="video/*" multiple>
        </div>
        <button class="btn" id="uploadVideoBtn" disabled>上传视频</button>
        <div class="status" id="videoStatus"></div>
      </div>
    </div>
  </section>

  <!-- ========== 图片检测（图库 / 结果 两个子页面）========== -->
  <section class="panel" id="tab-detect">
    <div class="toolbar">
      <label>置信度 <input type="number" id="detConf" value="0.01" min="0.01" max="0.99" step="0.05"></label>
      <label>尺寸 imgsz <input type="number" id="detImgsz" value="640" min="320" max="1920" step="32"></label>
      <label>模型 <select id="detWeights"></select></label>
      <label id="detClassesWrap" hidden>prompt <input type="text" id="detClasses" value="person" placeholder="person, car, 书本" size="22"></label>
    </div>

    <nav class="subnav">
      <button class="subtab active" data-sub="images">待检测图片</button>
      <button class="subtab" data-sub="result">检测结果</button>
      <div class="subnav-right">
        <span class="subnav-status" id="detResultName"></span>
        <button class="btn small ghost" id="refreshImages">刷新列表</button>
      </div>
    </nav>

    <div class="subpanel active" id="detect-pane-images">
      <div class="grid" id="imageGrid"></div>
    </div>

    <div class="subpanel" id="detect-pane-result">
      <div id="detectResult" class="result-box">点击「待检测图片」里的图片开始检测</div>
    </div>
  </section>

  <!-- ========== 视频检测 ========== -->
  <section class="panel" id="tab-video">
    <div class="toolbar">
      <label>置信度 <input type="number" id="vidConf" value="0.01" min="0.01" max="0.99" step="0.05"></label>
      <label>抽帧间隔 <input type="number" id="vidStride" value="1" min="1" max="30" step="1"></label>
      <label>显示形式 <select id="vidRender">
        <option value="box">框</option>
        <option value="dot">中心点</option>
      </select></label>
      <label>模型 <select id="vidWeights"></select></label>
      <label id="vidClassesWrap" hidden>prompt <input type="text" id="vidClasses" value="person" placeholder="person, car" size="20"></label>
      <button class="btn small" id="refreshVideos">刷新列表</button>
    </div>
    <div class="split">
      <div>
        <h2>视频列表</h2>
        <div id="videoList" class="list"></div>
      </div>
      <div>
        <h2>检测结果</h2>
        <div id="videoResult" class="result-box">点击左侧视频开始检测</div>
      </div>
    </div>
    <div class="outlib">
      <h2>检测结果库（data/outputs/）<button class="btn small ghost" id="refreshOutputs">刷新</button></h2>
      <div id="outputList" class="list"></div>
    </div>
  </section>

  <!-- ========== 训练 ========== -->
  <section class="panel" id="tab-train">
    <div class="split">
      <div>
        <h2>数据集（data/datasets/）</h2>
        <div id="datasetList" class="list"></div>
        <p class="hint">
          目录结构：<code>&lt;数据集&gt;/images/train</code> + <code>&lt;数据集&gt;/labels/train</code>，
          可选 <code>classes.txt</code> 写类别名（没有 <code>data.yaml</code> 时自动生成）
        </p>
      </div>
      <div>
        <h2>训练参数</h2>
        <div class="form">
          <label>数据集 <select id="trainDataset"></select></label>
          <label>起始权重 <select id="trainWeights"></select></label>
          <label>轮数 epochs <input type="number" id="trainEpochs" value="50" min="1"></label>
          <label>图像尺寸 imgsz <input type="number" id="trainImgsz" value="640" step="32" min="320"></label>
          <label>批大小 batch <input type="number" id="trainBatch" value="8" min="1"></label>
          <label>学习率 lr0 <input type="number" id="trainLr0" value="0.01" step="0.001" min="0.0001"></label>
          <button class="btn" id="trainBtn">开始训练</button>
        </div>
        <div id="trainResult" class="result-box"></div>
      </div>
    </div>
    <div class="annotate">
      <h2>标注数据
        <button class="btn small ghost" id="refreshAnnotate">刷新</button>
      </h2>
      <div class="annotate-bar">
        <label>数据集 <select id="annotateDataset"></select></label>
        <label>子集 <select id="annotateSplit">
          <option value="train">Train（训练集）</option>
          <option value="val">Val（验证集）</option>
        </select></label>
        <span class="annotate-stat" id="annotateStat"></span>
        <span class="annotate-tip">点图片进入全屏标注 → 预标注 → 改框/加框 → 保存</span>
      </div>
      <div id="annotateGrid" class="grid"></div>
    </div>
  </section>

  <!-- ========== 全屏标注器 ========== -->
  <div class="annotator-mask" id="annotatorMask" hidden>
    <div class="annotator">
      <header class="annotator-head">
        <span class="annotator-title" id="annotatorTitle"></span>
        <span class="annotator-sub" id="annotatorSub"></span>
        <div class="annotator-head-actions">
          <div class="seg" id="annShape">
            <button class="seg-btn active" data-shape="box">框</button>
            <button class="seg-btn" data-shape="dot">中心点</button>
          </div>
          <label title="关掉后连 hover 也不显示类别标签，只显示框"><input type="checkbox" id="annShowLabels" checked> 标签</label>
          <label>置信度 <input type="number" id="annConf" value="0.25" min="0.01" max="0.99" step="0.05" style="width:70px"></label>
          <label>模型 <select id="annWeights"></select></label>
          <label id="annClassesWrap" hidden>prompt <input type="text" id="annClasses" value="person" placeholder="person, car" size="18"></label>
          <button class="btn small" id="annPrelabel">预标注</button>
          <button class="btn small danger" id="annDeleteAll">清空</button>
          <button class="btn small ghost" id="annSave">保存</button>
          <button class="btn small ghost" id="annClose">关闭</button>
        </div>
      </header>
      <div class="annotator-body">
        <div class="annotator-stage" id="annStage">
          <div class="ann-canvas" id="annCanvas">
            <img class="ann-base" id="annBaseImg" alt="标注图" draggable="false">
            <div class="ann-boxes" id="annBoxes"></div>
          </div>
          <div class="ann-msg" id="annMsg"></div>
        </div>
        <aside class="annotator-side">
          <div class="ann-side-block">
            <h3>类别</h3>
            <div id="annClassesList" class="ann-classes"></div>
          </div>
          <div class="ann-side-block">
            <h3>标注 <span id="annCount"></span></h3>
            <div id="annList" class="ann-list"></div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <footer class="foot">
    <a href="/docs" target="_blank">API 文档</a>
    <span>·</span>
    <span>数据目录：data/</span>
  </footer>
</div>

<!-- 缩略图悬浮大图预览（随鼠标定位） -->
<div class="hover-preview" id="hoverPreview">
  <img src="" alt="">
  <div class="cap" id="hoverPreviewCap"></div>
</div>

<script src="/app.js?v=32"></script>
</body>
</html>
