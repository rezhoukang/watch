<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A/B教室匿名人脸整理</title><style>
body{font-family:"Microsoft YaHei",sans-serif;background:#f4f6fa;color:#202c3c;margin:24px}h1{font-size:24px}h2{font-size:18px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#f4f6fa;padding:12px 0;z-index:1}button,input,select{padding:9px;border:1px solid #ccd2dd;border-radius:6px;font:inherit}button{cursor:pointer;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px;margin:16px 0 28px}.card{background:white;padding:14px;border-radius:8px}.card p{font-size:13px;min-height:36px;color:#687286}.card[data-state=accepted]{border-top:3px solid #1e9b62}.card[data-state=skipped]{border-top:3px solid #e59a34}.photos{display:flex;gap:8px;margin-top:12px;align-items:center;min-height:120px}.photos img{width:100px;max-height:140px;object-fit:contain;image-rendering:auto}.card input{width:110px}.scene{max-width:100%;margin-top:12px}summary{cursor:pointer;color:#3465a4}[hidden]{display:none!important}#message{color:#526278;font-size:13px}
</style><h1>A/B教室匿名人脸整理</h1><p><!--SUMMARY--></p><p>编号只表示这批图片中的检测记录。姓名由你手动填写，留空表示尚未确认。对齐图为方便查看进行了放大，原始清晰度以 Head 和人脸裁剪图为准。</p>
<div class="toolbar"><select id="state" aria-label="显示状态"><option value="all">全部记录</option><option value="accepted">筛选通过</option><option value="skipped">已跳过</option></select><input id="search" aria-label="搜索编号" placeholder="搜索匿名编号"><button id="export">导出人工姓名 JSON</button><label>恢复标注 <input id="import" type="file" accept=".json" style="width:170px"></label></div><p id="message">人工填写后可导出 JSON。浏览器允许时也会自动保存在当前浏览器。</p><!--CARDS-->
<script>
const report=/*REPORT_DATA*/;
const inputs=[...document.querySelectorAll('[data-name]')];const cards=[...document.querySelectorAll('.card')];
const storageKey='anonymous-manual:'+report.run_id;const message=document.getElementById('message');
const values=()=>Object.fromEntries(inputs.map(input=>[input.dataset.name,input.value.trim()]));
function restore(labels){for(const input of inputs)input.value=typeof labels[input.dataset.name]==='string'?labels[input.dataset.name].slice(0,80):'';}
try{restore(JSON.parse(localStorage.getItem(storageKey)||'{}'));}catch(e){message.textContent='当前浏览器不能读取本地保存，请用导出 JSON 保存人工标注。';}
for(const input of inputs)input.addEventListener('input',()=>{try{localStorage.setItem(storageKey,JSON.stringify(values()));message.textContent='已在当前浏览器保存，请及时导出 JSON 备份。';}catch(e){message.textContent='当前浏览器无法自动保存，请点击导出 JSON。';}});
function filter(){const state=document.getElementById('state').value,search=document.getElementById('search').value.trim().toUpperCase();for(const card of cards)card.hidden=(state!=='all'&&card.dataset.state!==state)||!card.dataset.id.includes(search);}
document.getElementById('state').addEventListener('change',filter);document.getElementById('search').addEventListener('input',filter);
document.getElementById('export').addEventListener('click',()=>{const names=values();const payload={run_id:report.run_id,label_source:'human',labels:report.images.flatMap(image=>image.records.map(record=>({...record,source:image.source,manual_name:names[record.anonymous_id]||''})))};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download=report.run_id+'_manual_names.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
document.getElementById('import').addEventListener('change',async event=>{try{const file=event.target.files[0];if(!file)return;const data=JSON.parse(await file.text());if(data.run_id!==report.run_id||!Array.isArray(data.labels))throw new Error('批次不一致');const known=new Set(inputs.map(i=>i.dataset.name));if(data.labels.some(v=>!known.has(v.anonymous_id)||typeof v.manual_name!=='string'))throw new Error('编号或姓名格式错误');restore(Object.fromEntries(data.labels.map(v=>[v.anonymous_id,v.manual_name])));try{localStorage.setItem(storageKey,JSON.stringify(values()));}catch(e){}message.textContent='已恢复本批次人工标注。';}catch(e){message.textContent='导入失败：'+e.message;}});
</script></html>
